<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | CareFlow HMS</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-page">

    <!-- Left side: brand -->
    <section class="login-art">
      <div class="brand-lg">
        <span class="logo-tile"><img src="assets/logo.png" alt="CareFlow logo"></span>
        <strong>CareFlow</strong>
      </div>
      <div>
        <h2>Every patient, doctor and medicine in one place.</h2>
        <p>Log in to manage appointments, patient records and pharmacy stock.</p>
      </div>
      <div class="foot">Unit 2 Hospital, PAF &nbsp;|&nbsp; Internship project</div>
    </section>

    <!-- Right side: login form -->
    <section class="login-form-wrap">
      <form class="login-form" id="loginForm">
        <h1>Welcome back</h1>
        <p>Log in with your staff account.</p>

        <div class="error-msg" id="errorMsg" role="alert">Email or password is incorrect. Please try again.</div>

        <div class="field">
          <label for="email">Email or username</label>
          <input type="text" id="email" placeholder="you@careflow.pk" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <div class="row">
          <label style="display:flex;gap:8px;align-items:center"><input type="checkbox"> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary">Log in</button>
      </form>
    </section>
  </div>

  <script>
    // Abhi asli login nahi hai (backend baad mein aayega).
    // Demo: password kam az kam 4 characters ka ho to dashboard khul jaye.
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const password = document.getElementById("password").value;
      if (password.length >= 4) {
        window.location.href = "dashboard.html";
      } else {
        document.getElementById("errorMsg").classList.add("show");
      }
    });
  </script>
</body>
</html>
