<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>CareFlow</title>

  <link rel="icon" href="../assets/logo/careflow-logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <div id="sidebar-container"></div>


  <main class="main">

    <header class="topbar">

      <div style="display:flex; align-items:center; gap:12px;">

        <button
          class="menu-btn"
          id="menuBtn"
          type="button"
          aria-label="Open menu"
        >
          ☰
        </button>

        <div>

          <h1>User Management</h1>

          <p>
            Manage hospital system users
          </p>

        </div>

      </div>


      <div class="profile">

        <div class="avatar">
          A
        </div>

        <div>
          <b>Admin</b>
          <small>Administrator</small>
        </div>

      </div>

    </header>


    <section class="content">

      <div class="panel">

        <div class="panel-head">

          <div>
            <h2>All Users</h2>
          </div>

          <a
            href="create-user.html"
            class="btn btn-primary"
          >
            + Create User
          </a>

        </div>


        <!-- Search -->

        <div style="padding:0 20px 20px;">

          <input
            type="text"
            id="searchInput"
            class="input"
            placeholder="Search user by ID..."
          >

        </div>


        <!-- Users Table -->

        <div class="table-wrap">

          <table>

            <thead>

              <tr>

                <th>User ID</th>

                <th>Name</th>

                <th>Email</th>

                <th>Role</th>

                <th>Department</th>

                <th>Status</th>

                <th>Action</th>

              </tr>

            </thead>


            <tbody id="usersTableBody">

              <tr>

                <td colspan="7" style="text-align:center;">
                  Loading users...
                </td>

              </tr>

            </tbody>

          </table>

        </div>

      </div>

    </section>

  </main>


  <script src="../js/shared.js"></script>
  <script src="../js/admin.js"></script>


  <script>

    let allUsers = [];


    // Load users from database

    async function loadUsers() {

      const tableBody =
        document.getElementById("usersTableBody");


      try {

        const response = await fetch(
          "http://localhost:5000/api/users"
        );


        if (!response.ok) {

          throw new Error(
            "Failed to load users."
          );

        }


        allUsers = await response.json();


        displayUsers(allUsers);


      } catch (error) {

        console.error(
          "Error loading users:",
          error
        );


        tableBody.innerHTML = `

          <tr>

            <td
              colspan="7"
              style="text-align:center;"
            >
              Unable to load users.
            </td>

          </tr>

        `;

      }

    }


    // Display users in table

    function displayUsers(users) {

      const tableBody =
        document.getElementById("usersTableBody");


      tableBody.innerHTML = "";


      if (users.length === 0) {

        tableBody.innerHTML = `

          <tr>

            <td
              colspan="7"
              style="text-align:center;"
            >
              No users found.
            </td>

          </tr>

        `;

        return;

      }


      users.forEach(function(user) {

        const row =
          document.createElement("tr");


        const statusClass =
          user.status === "Active"
            ? "badge-success"
            : "badge-warning";


        row.innerHTML = `

          <td>
            ${user.user_id}
          </td>

          <td>
            ${user.full_name}
          </td>

          <td>
            ${user.email}
          </td>

          <td>
            ${user.role_name}
          </td>

          <td>
            ${user.department_name}
          </td>

          <td>

            <span class="badge ${statusClass}">
              ${user.status}
            </span>

          </td>

          <td>
    <div class="table-actions">

        <a
            href="edit-user.html?id=${encodeURIComponent(user.user_id)}"
            class="btn btn-secondary btn-small"
        >
            Edit
        </a>

        ${user.role_name !== "Admin" ? `
    <button
        type="button"
        class="btn btn-danger btn-small"
        onclick="deleteUser('${user.user_id}')"
    >
        Delete
    </button>
` : ""}

    </div>
</td>

        `;


        tableBody.appendChild(row);

      });

    }


    // Search users by User ID

    document
      .getElementById("searchInput")
      .addEventListener("input", function() {

        const searchValue =
          this.value.trim().toLowerCase();


        const filteredUsers =
          allUsers.filter(function(user) {

            return user.user_id
              .toLowerCase()
              .includes(searchValue);

          });


        displayUsers(filteredUsers);

      });


    // Load users when page opens

    document.addEventListener(
      "DOMContentLoaded",
      loadUsers
    );

  </script>

<script>

    async function deleteUser(userId) {

        const confirmed = confirm(
            "Are you sure you want to delete this user?\n\n" +
            "User ID: " + userId +
            "\n\nThis action cannot be undone."
        );

        if (!confirmed) {
            return;
        }


        try {

            const response = await fetch(
                `http://localhost:5000/api/users/${encodeURIComponent(userId)}`,
                {
                    method: "DELETE"
                }
            );


            const data = await response.json();


            if (!response.ok) {

                alert(
                    data.message ||
                    "Failed to delete user."
                );

                return;
            }


            alert(
                "User deleted successfully."
            );


            // Reload the users table
            location.reload();


        } catch (error) {

            console.error(
                "Delete user error:",
                error
            );

            alert(
                "Could not connect to the CareFlow backend."
            );

        }

    }

</script>

</body>
</html>
