<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Edit User | CareFlow</title>

  <link rel="icon" href="../assets/logo/careflow-logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <div id="sidebar-container"></div>

  <main class="main">

    <header class="topbar">

      <div style="display:flex; align-items:center; gap:12px;">

        <button
          class="menu-btn"
          id="menuBtn"
          type="button"
          aria-label="Open menu"
        >
          ☰
        </button>

        <div>
          <h1>Edit User</h1>
          <p>Update hospital system user information</p>
        </div>

      </div>

      <div class="profile">

        <div class="avatar">A</div>

        <div>
          <b>Admin</b>
          <small>Administrator</small>
        </div>

      </div>

    </header>


    <section class="content">

      <div class="form-card">

        <div style="margin-bottom:22px;">

          <h2 style="font-size:18px;">
            User Information
          </h2>

          <p style="color:var(--muted); font-size:13px; margin-top:4px;">
            Update the details of the selected user
          </p>

        </div>


        <form id="editUserForm">

          <div class="form-grid">

            <!-- User ID -->

            <div class="field">

              <label for="userId">
                User ID
              </label>

              <input
                type="text"
                id="userId"
                readonly
              >

            </div>


            <!-- Full Name -->

            <div class="field">

              <label for="fullName">
                Full Name
              </label>

              <input
                type="text"
                id="fullName"
                placeholder="Enter full name"
                required
              >

            </div>


            <!-- Email -->

            <div class="field">

              <label for="email">
                Email
              </label>

              <input
                type="email"
                id="email"
                placeholder="Enter email address"
                required
              >

            </div>


            <!-- Phone -->

            <div class="field">

              <label for="phone">
                Phone
              </label>

              <input
                type="tel"
                id="phone"
                placeholder="Enter phone number"
                required
              >

            </div>


            <!-- Role -->

            <div class="field">

              <label for="role">
                Role
              </label>

              <select id="role" required>

                <option value="">
                  Select role
                </option>

                <option value="1">
                  Doctor
                </option>

                <option value="2">
                  Receptionist
                </option>

                <option value="3">
                  Pharmacist
                </option>

              </select>

            </div>


            <!-- Department -->

            <div class="field">

              <label for="department">
                Department
              </label>

              <select id="department" required>

                <option value="">
                  Select department
                </option>

                <option value="DEP-001">
                  Administration
                </option>

                <option value="DEP-002">
                  Cardiology
                </option>

                <option value="DEP-003">
                  Dermatology
                </option>

                <option value="DEP-004">
                  Emergency
                </option>

                <option value="DEP-005">
                  ENT
                </option>

                <option value="DEP-006">
                  Gastroenterology
                </option>

                <option value="DEP-007">
                  General Medicine
                </option>

                <option value="DEP-008">
                  Gynecology
                </option>

                <option value="DEP-009">
                  Neurology
                </option>

                <option value="DEP-010">
                  Oncology
                </option>

                <option value="DEP-011">
                  Orthopedics
                </option>

                <option value="DEP-012">
                  Pharmacy
                </option>

                <option value="DEP-013">
                  Radiology
                </option>

                <option value="DEP-014">
                  Urology
                </option>

              </select>

            </div>


            <!-- Specialization -->

            <div
              class="field"
              id="specializationField"
            >

              <label for="specialization">
                Specialization
              </label>

              <input
                type="text"
                id="specialization"
                placeholder="Enter specialization"
              >

            </div>


            <!-- Status -->

            <div class="field">

              <label for="status">
                Status
              </label>

              <select id="status" required>

                <option value="Active">
                  Active
                </option>

                <option value="Inactive">
                  Inactive
                </option>

              </select>

            </div>

          </div>


          <!-- Form Actions -->

          <div class="form-actions">

            <a
              href="users.html"
              class="btn btn-secondary"
            >
              Cancel
            </a>

            <button
              type="submit"
              class="btn btn-primary"
            >
              Save Changes
            </button>

          </div>

        </form>

      </div>

    </section>

  </main>


  <!-- Success Modal -->

  <div
    class="modal-overlay"
    id="editUserModal"
  >

    <div class="modal">

      <div class="modal-head">

        <h3>
          User Updated
        </h3>

        <button
          type="button"
          onclick="closeModal('editUserModal')"
        >
          ×
        </button>

      </div>

      <div style="padding:20px;">
        User information updated successfully.
      </div>

    </div>

  </div>


  <script src="../js/shared.js"></script>
  <script src="../js/admin.js"></script>


  <script>

    const editUserForm =
      document.getElementById("editUserForm");

    const roleSelect =
      document.getElementById("role");

    const specializationField =
      document.getElementById("specializationField");

    const specializationInput =
      document.getElementById("specialization");


    /*
       Get User ID from the URL

       Example:
       edit-user.html?id=USR-002
    */

    const urlParams =
      new URLSearchParams(window.location.search);

    const userId =
      urlParams.get("id");


    function updateSpecializationField() {

      if (roleSelect.value === "1") {

        specializationField.style.display = "block";

        specializationInput.required = true;

      } else {

        specializationField.style.display = "none";

        specializationInput.required = false;

      }

    }


    /*
       Load selected user
    */

    async function loadUser() {

      if (!userId) {

        alert("No user ID was provided.");

        window.location.href = "users.html";

        return;

      }


      try {

        const response =
          await fetch(
            `http://localhost:5000/api/users/${encodeURIComponent(userId)}`
          );


        const user =
          await response.json();


        if (!response.ok) {

          alert(
            user.message ||
            "Failed to load user."
          );

          window.location.href = "users.html";

          return;

        }


        document.getElementById("userId").value =
          user.user_id;

        document.getElementById("fullName").value =
          user.full_name;

        document.getElementById("email").value =
          user.email;

        document.getElementById("phone").value =
          user.phone || "";

        document.getElementById("role").value =
          user.role_id;

        document.getElementById("department").value =
          user.department_id;

        document.getElementById("specialization").value =
          user.specialization || "";

        document.getElementById("status").value =
          user.status;


        updateSpecializationField();


      } catch (error) {

        console.error(
          "Load user error:",
          error
        );

        alert(
          "Could not connect to the CareFlow backend."
        );

      }

    }


    /*
       Save changes
    */

    editUserForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const updatedUser = {

          full_name:
            document.getElementById("fullName").value.trim(),

          email:
            document.getElementById("email").value.trim(),

          phone:
            document.getElementById("phone").value.trim(),

          role_id:
            document.getElementById("role").value,

          department_id:
            document.getElementById("department").value,

          specialization:
            document.getElementById("specialization").value.trim(),

          status:
            document.getElementById("status").value

        };


        try {

          const response =
            await fetch(
              `http://localhost:5000/api/users/${encodeURIComponent(userId)}`,
              {
                method: "PUT",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify(updatedUser)

              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            alert(
              data.message ||
              "Failed to update user."
            );

            return;

          }


          alert(
            "User updated successfully!"
          );


          window.location.href =
            "users.html";


        } catch (error) {

          console.error(
            "Update user error:",
            error
          );

          alert(
            "Could not connect to the CareFlow backend."
          );

        }

      }
    );


    roleSelect.addEventListener(
      "change",
      updateSpecializationField
    );


    function closeModal(modalId) {

      const modal =
        document.getElementById(modalId);

      if (modal) {
        modal.style.display = "none";
      }

    }


    loadUser();

  </script>

</body>
</html>
