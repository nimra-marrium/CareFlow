<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareFlow</title>
  <link rel="icon" href="../assets/logo/careflow-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <div id="sidebar-container"></div>
  <main class="main">
    <header class="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button
          class="menu-btn"
          id="menuBtn"
          type="button"
          aria-label="Open menu"
        >
          ☰
        </button>
        <div>
          <h1>Dashboard</h1>
          <p>Overview of your hospital system</p>
        </div>
      </div>

      <div class="profile">
        <div class="avatar">A</div>
        <div>
          <b>Admin</b>
          <small>Administrator</small>
        </div>
      </div>

    </header>
    <section class="content">
      <div style="margin-bottom:24px;">
        <h2 style="font-size:24px; margin-bottom:4px;">
          Welcome back, Admin
        </h2>
        <p style="color:var(--muted);">
          Here's an overview of CareFlow today.
        </p>
      </div>

      <div class="cards">
        <div class="stat">
          <div class="ico">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
          </div>

          <div>
            <div class="num">20</div>
            <div class="lbl">Total Users</div>
          </div>

        </div>

        <div class="stat">
          <div class="ico">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M20 6 9 17l-5-5"></path>
            </svg>
          </div>
          <div>
            <div class="num">10</div>
            <div class="lbl">Active Users</div>
          </div>

        </div>

        <div class="stat">
          <div class="ico">
            <svg class="icon" viewBox="0 0 24 24">
              <circle cx="12" cy="7" r="4"></circle>
              <path d="M5.5 21a6.5 6.5 0 0 1 13 0"></path>
            </svg>
          </div>

          <div>
            <div class="num">5</div>
            <div class="lbl">Doctors</div>
          </div>
        </div>

        <div class="stat">
          <div class="ico">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M3 21h18"></path>
              <path d="M5 21V5l7-3 7 3v16"></path>
              <path d="M9 9h2"></path>
              <path d="M13 9h2"></path>
              <path d="M9 13h2"></path>
              <path d="M13 13h2"></path>
            </svg>
          </div>
          <div>
            <div class="num">10</div>
            <div class="lbl">Departments</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div>
            <h2>Quick Actions</h2>
          </div>
        </div>
        <div style="
          display:flex;
          gap:12px;
          flex-wrap:wrap;
          padding:0 20px 20px;
        ">
          <a href="create-user.html" class="btn btn-primary">
            + Create User
          </a>

          <a href="users.html" class="btn btn-secondary">
            Manage Users
          </a>

          <a href="roles.html" class="btn btn-secondary">
            Manage Roles
          </a>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/shared.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
