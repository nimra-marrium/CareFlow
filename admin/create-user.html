```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Create User | CareFlow</title>

  <link rel="icon" href="../assets/logo/careflow-logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <div id="sidebar-container"></div>

  <main class="main">

    <header class="topbar">

      <div style="display:flex; align-items:center; gap:12px;">

        <button
          class="menu-btn"
          id="menuBtn"
          type="button"
          aria-label="Open menu"
        >
          ☰
        </button>

        <div>
          <h1>Create User</h1>
          <p>Create a new hospital system account</p>
        </div>

      </div>

      <div class="profile">

        <div class="avatar">A</div>

        <div>
          <b>Admin</b>
          <small>Administrator</small>
        </div>

      </div>

    </header>


    <section class="content">

      <div class="form-card">

        <div style="margin-bottom:22px;">

          <h2 style="font-size:18px;">
            User Information
          </h2>

          <p style="color:var(--muted); font-size:13px; margin-top:4px;">
            Enter the details for the new user
          </p>

        </div>


        <form id="createUserForm">

          <div class="form-grid">

            <!-- User ID -->

            <div class="field">

              <label for="userId">
                User ID
              </label>

              <input
                type="text"
                id="userId"
                value="Auto-generated"
                readonly
              >

              <small class="form-helper">
                User ID will be generated automatically.
              </small>

            </div>


            <!-- Full Name -->

            <div class="field">

              <label for="fullName">
                Full Name
              </label>

              <input
                type="text"
                id="fullName"
                placeholder="Enter full name"
                required
              >

            </div>


            <!-- Email -->

            <div class="field">

              <label for="email">
                Email
              </label>

              <input
                type="email"
                id="email"
                placeholder="Enter email address"
                required
              >

            </div>


            <!-- Phone -->

            <div class="field">

              <label for="phone">
                Phone
              </label>

              <input
                type="tel"
                id="phone"
                placeholder="Enter phone number"
                required
              >

            </div>


            <!-- Password -->

            <div class="field">

              <label for="password">
                Password
              </label>

              <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
              >

            </div>


            <!-- Role -->

            <div class="field">

              <label for="role">
                Role
              </label>

              <select id="role" required>

    <option value="">
        Select role
    </option>

</select>

            </div>


            <!-- Department -->

            <div class="field">

              <label for="department">
                Department
              </label>

              <select id="department" required>

    <option value="">
        Select department
    </option>

</select>

            </div>


            <!-- Specialization -->

            <div
              class="field"
              id="specializationField"
              style="display:none;"
            >

              <label for="specialization">
                Specialization
              </label>

              <input
                type="text"
                id="specialization"
                placeholder="Enter specialization"
              >

            </div>

          </div>


          <!-- Form Actions -->

          <div class="form-actions">

            <a
              href="users.html"
              class="btn btn-secondary"
            >
              Cancel
            </a>

            <button
              type="submit"
              class="btn btn-primary"
            >
              Create User
            </button>

          </div>

        </form>

      </div>

    </section>

  </main>


  <!-- Success Modal -->

  <div
    class="modal-overlay"
    id="createUserModal"
  >

    <div class="modal">

      <div class="modal-head">

        <h3>
          User Created
        </h3>

        <button
          type="button"
          onclick="closeModal('createUserModal')"
        >
          ×
        </button>

      </div>

      <div style="padding:20px;">
        User created successfully.
      </div>

    </div>

  </div>


  <script src="../js/shared.js"></script>
  <script src="../js/admin.js"></script>

  <script>

    const roleSelect =
        document.getElementById("role");

    const departmentSelect =
        document.getElementById("department");

    const specializationField =
        document.getElementById("specializationField");

    const specializationInput =
        document.getElementById("specialization");


    /* =====================================================
       LOAD ROLES
    ===================================================== */

    async function loadRoles() {

        try {

            const response =
                await fetch(
                    "http://localhost:5000/api/roles"
                );


            const roles =
                await response.json();


            if (!response.ok) {

                alert(
                    "Failed to load roles."
                );

                return;

            }


            roles
                .filter(role => role.role_name !== "Admin")
                .forEach(role => {

                    const option =
                        document.createElement("option");

                    option.value =
                        role.role_id;

                    option.textContent =
                        role.role_name;

                    roleSelect.appendChild(option);

                });


        } catch (error) {

            console.error(
                "Load roles error:",
                error
            );

            alert(
                "Could not load roles from the CareFlow backend."
            );

        }

    }


    /* =====================================================
       LOAD DEPARTMENTS
    ===================================================== */

    async function loadDepartments() {

        try {

            const response =
                await fetch(
                    "http://localhost:5000/api/departments"
                );


            const departments =
                await response.json();


            if (!response.ok) {

                alert(
                    "Failed to load departments."
                );

                return;

            }


            departments.forEach(department => {

                const option =
                    document.createElement("option");

                option.value =
                    department.department_id;

                option.textContent =
                    department.department_name;

                departmentSelect.appendChild(option);

            });


        } catch (error) {

            console.error(
                "Load departments error:",
                error
            );

            alert(
                "Could not load departments from the CareFlow backend."
            );

        }

    }


    /* =====================================================
       SPECIALIZATION
    ===================================================== */

    function updateSpecializationField() {

        if (roleSelect.value === "1") {

            specializationField.style.display =
                "block";

            specializationInput.required =
                true;

        } else {

            specializationField.style.display =
                "none";

            specializationInput.required =
                false;

            specializationInput.value =
                "";

        }

    }


    roleSelect.addEventListener(
        "change",
        updateSpecializationField
    );


    loadRoles();
    loadDepartments();

</script>

</body>
</html>
