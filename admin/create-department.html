<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Department | CareFlow</title>

  <link rel="icon" href="../assets/logo/careflow-logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <div id="sidebar-container"></div>

  <main class="main-content">

    <div class="page-header">
      <div>
        <h1>Create Department</h1>
        <p>Add a new department to CareFlow.</p>
      </div>
    </div>

    <section class="form-card">

      <form id="createDepartmentForm">

        <div class="form-grid">

          <div class="field">
            <label for="departmentName">Department Name</label>
            <input
              type="text"
              id="departmentName"
              placeholder="Enter department name"
              required
            >
          </div>

          <div class="field">
            <label for="departmentCode">Department Code</label>
            <input
              type="text"
              id="departmentCode"
              placeholder="e.g. CAR"
              maxlength="5"
              required
            >
          </div>

        </div>

        <div class="form-actions">
          <a href="departments.html" class="btn btn-secondary">
            Cancel
          </a>

          <button type="submit" class="btn btn-primary">
            Create Department
          </button>
        </div>

      </form>

    </section>

  </main>

  <script src="../js/shared.js"></script>

  <script>
    document
      .getElementById("createDepartmentForm")
      .addEventListener("submit", function (event) {
        event.preventDefault();

        // Backend/database will be connected later.
        alert("Department created successfully.");

        window.location.href = "departments.html";
      });
  </script>

</body>
</html>
